version: '3.8'

services:
  # Ollama Service - Local LLM Runtime
  ollama:
    image: ollama/ollama:latest
    container_name: medical-rag-ollama
    ports:
      - "11434:11434"
    volumes:
      # Persist Ollama models across container restarts
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - rag-network
    restart: unless-stopped

  # Medical RAG Chatbot Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medical-rag-app
    ports:
      - "5000:5000"
    environment:
      # Ollama Configuration
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.2:latest

      # Flask Configuration
      - FLASK_ENV=production
      - FLASK_DEBUG=0
    volumes:
      # Mount vector store and data as volumes (optional)
      # Uncomment if you want to persist or update data externally
      # - ./vectorstore:/app/vectorstore:ro
      # - ./data:/app/data:ro
      # - ./logs:/app/logs
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - rag-network
    restart: unless-stopped

networks:
  rag-network:
    driver: bridge

volumes:
  ollama-data:
    driver: local
